[project]
name = "airlock"
version = "0.1.0"
description = "A small, tested gate between AI agents and their tools: allowlists, risk classes, approval with dry-run default, budgets, tamper-evident audit log."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nico Vogel" }]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
